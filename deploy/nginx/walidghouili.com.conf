# Reverse proxy for the Next.js site (served by PM2 on 127.0.0.1:3000).
# Serves the site on BOTH hosts. Canonical URLs in the HTML point to
# https://walidghouili.com (NEXT_PUBLIC_SITE_URL), so walid.innoviaburst.com
# can keep serving without a redirect and without a duplicate-content penalty.
#
# Install on the server:
#   sudo cp deploy/nginx/walidghouili.com.conf /etc/nginx/sites-available/walidghouili.com
#   sudo ln -sf /etc/nginx/sites-available/walidghouili.com /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/walid.innoviaburst.com   # merged into this file
#   sudo nginx -t && sudo systemctl reload nginx
#
# HTTPS for all hosts (certbot rewrites this file to add the :443 blocks).
# If walid.innoviaburst.com is proxied by Cloudflare (orange cloud), set it to
# DNS-only while certbot runs, or drop it from the -d list and let Cloudflare
# terminate TLS for that host:
#   sudo certbot --nginx -d walidghouili.com -d www.walidghouili.com -d walid.innoviaburst.com

# www -> apex
server {
    listen 80;
    listen [::]:80;
    server_name www.walidghouili.com;
    return 301 https://walidghouili.com$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name walidghouili.com walid.innoviaburst.com;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    # Long cache for Next.js immutable build assets.
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_read_timeout 60s;
        proxy_cache_bypass $http_upgrade;
    }
}
