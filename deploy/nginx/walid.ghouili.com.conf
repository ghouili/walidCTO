# Reverse proxy for the Next.js site (served by PM2 on 127.0.0.1:3000).
#
# Install on the server:
#   sudo cp deploy/nginx/walid.ghouili.com.conf /etc/nginx/sites-available/walid.ghouili.com
#   sudo ln -sf /etc/nginx/sites-available/walid.ghouili.com /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/walid.innoviaburst.com   # replaced by the redirect block below
#   sudo nginx -t && sudo systemctl reload nginx
#
# Then add HTTPS for both hosts (certbot rewrites this file to add the :443 blocks):
#   sudo certbot --nginx -d walid.ghouili.com -d walid.innoviaburst.com
#
# DNS: A/AAAA record for walid.ghouili.com -> this server (Cloudflare: DNS-only / grey cloud
# while running certbot, proxy can be enabled afterwards).

# Old host: permanent redirect, path preserved (keeps Google rankings and existing links).
server {
    listen 80;
    listen [::]:80;
    server_name walid.innoviaburst.com;
    return 301 https://walid.ghouili.com$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name walid.ghouili.com;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    # Security headers. next.config.ts sends the same set so the app is safe
    # without nginx too; hide the upstream copies so browsers get one of each.
    # NOTE: nginx drops server-level add_header in any location that has its
    # own add_header, so the locations below repeat this block.
    proxy_hide_header Strict-Transport-Security;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header Referrer-Policy;
    proxy_hide_header Permissions-Policy;
    proxy_hide_header X-Frame-Options;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # Long cache for Next.js immutable build assets.
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
    }

    # Files from public/ (images, icons, the checklist PDFs): 7 days.
    location ~* \.(?:png|jpe?g|webp|avif|svg|ico|pdf|woff2?)$ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=604800";
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_read_timeout 60s;
        proxy_cache_bypass $http_upgrade;
    }
}
